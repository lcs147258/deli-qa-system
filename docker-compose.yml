# DeliRAG 第二版（pgvector 轻量化）中间件编排
# 启动: docker compose up -d        查看状态: docker compose ps
# 看日志: docker compose logs -f paradedb     停止: docker compose stop
#
# 第二版架构（容器 3 个，可跑在 4GB 内存服务器）：
#   ParadeDB 5434  PostgreSQL 17 + pgvector(dense/HNSW) + pg_search(Lindera BM25)
#                  一个容器替代旧版 Milvus + etcd + MinIO 三件套，双路召回+RRF 全在 SQL 内
#   Redis    6380  → 容器内 6379  (密码 1234)  ※ 6379 被 agent-redis-1 占用
#   MySQL    3307  → 容器内 3306  ※ 本机 3306 已被原生 MySQL80 服务占用
#
# 本机注意：etcd/minio/milvus 的 edurag-* 容器与教育版项目共用，故本文件不再定义它们；
# 教育版需要时在教育版项目目录自行 docker start，互不影响。

services:
  paradedb:
    container_name: edurag-paradedb
    restart: unless-stopped          # Docker 重启后自动拉起
    # 版本锁定策略：x.y.z-pgNN，禁 latest（ParadeDB 迭代快，pg_search SQL 语法跨小版本有变）
    # 0.25.11 = 稳定线第 11 个补丁版；PG17 主流稳定；镜像多架构(amd64/arm64)
    image: paradedb/paradedb:0.25.11-pg17
    # 4GB 小内存调优：shared_buffers 128MB、单查询 work_mem 4MB、规划器缓存假设 384MB
    command:
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=60
    environment:
      POSTGRES_USER: deli
      POSTGRES_PASSWORD: delipg123
      POSTGRES_DB: deli_qa
    ports:
      # 宿主 5434：本机 5432 被 fitagent 的 pgvector 占用，严格隔离
      - "5434:5432"
    volumes:
      - ./volumes/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deli -d deli_qa"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edurag]

  redis:
    container_name: edurag-redis
    restart: unless-stopped          # Docker 重启后自动拉起，避免"服务莫名连不上"
    image: redis:7-alpine
    command: redis-server --requirepass 1234 --appendonly yes
    ports:
      # 宿主端口用 6380: 6379 已被 agent-redis-1(另一个项目) 占用
      - "6380:6379"
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1234", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [edurag]

  mysql:
    container_name: edurag-mysql
    restart: unless-stopped          # Docker 重启后自动拉起，避免"服务莫名连不上"
    image: mysql:8.0.36
    # 4GB 小内存：InnoDB 缓冲池压到 128MB（docker run 后建议宿主再加 2GB swap）
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=128M
      --max-connections=60
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: subjects_kg
    ports:
      - "3307:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [edurag]

networks:
  edurag:
    driver: bridge
